name: MultiArchDockerBuild

on:
  push:
    branches:
      - master
      - develop
      - feat/healthcheck-436
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_multi_arch_image:
    name: Build multi-arch Docker image.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "GIT_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          if [ "$GITHUB_REF" = "refs/heads/feat/healthcheck-436" ]; then
            echo "IMAGE_TAG=healthcheck" >> $GITHUB_ENV
            echo "DEBIAN_TAG=healthcheck-debian" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DEBIAN_TAG=debian" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Login to DockerHub
        if: ${{ github.repository == 'claabs/epicgames-freegames-node' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Alpine)
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/healthcheck-436' }}
        uses: docker/build-push-action@v7
        with:
          provenance: false # enable later when runtime support is better
          target: deploy
          push: true
          tags: |
            ${{ github.repository == 'claabs/epicgames-freegames-node' && format('charlocharlie/epicgames-freegames:{0}', env.IMAGE_TAG) || '' }}
            ${{ github.repository == 'claabs/epicgames-freegames-node' && format('charlocharlie/epicgames-freegames:{0}', github.sha) || '' }}
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BRANCH=${{ env.GIT_BRANCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}

      - name: Build and push (Debian)
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/healthcheck-436' }}
        uses: docker/build-push-action@v7
        with:
          provenance: false # enable later when runtime support is better
          target: deploy
          push: true
          file: Dockerfile.debian
          tags: |
            ${{ github.repository == 'claabs/epicgames-freegames-node' && format('charlocharlie/epicgames-freegames:{0}', env.DEBIAN_TAG) || '' }}
            ${{ github.ref == 'refs/heads/master' && github.repository == 'claabs/epicgames-freegames-node' && 'charlocharlie/epicgames-freegames:bullseye-slim' || '' }}
            ${{ github.ref == 'refs/heads/master' && format('{0}:bullseye-slim', env.GHCR_IMAGE) || '' }}
            ${{ env.GHCR_IMAGE }}:${{ env.DEBIAN_TAG }}
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BRANCH=${{ env.GIT_BRANCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ github.workflow }}-Debian
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-Debian

      - name: Build and push dev
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: docker/build-push-action@v7
        with:
          provenance: false # enable later when runtime support is better
          target: deploy
          push: true
          tags: |
            ${{ github.repository == 'claabs/epicgames-freegames-node' && 'charlocharlie/epicgames-freegames:dev' || '' }}
            ${{ env.GHCR_IMAGE }}:dev
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BRANCH=${{ env.GIT_BRANCH }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
